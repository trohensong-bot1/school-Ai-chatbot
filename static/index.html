<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>하안북중학교 AI 도우미</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
    }

    .chat-header {
      padding: 16px;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e5ea;
      text-align: center;
      font-weight: 600;
      font-size: 18px;
      color: #1c1c1e;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #f9f9fb;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: #007aff;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      align-self: flex-start;
      background-color: #e9e9eb;
      color: #000000;
      border-bottom-left-radius: 4px;
      white-space: pre-wrap; 
      word-wrap: break-word;
    }

    .message.blocked {
      align-self: center;
      background-color: #ffe5e5;
      color: #d32f2f;
      font-size: 13px;
      border-radius: 12px;
      text-align: center;
      max-width: 90%;
    }

    .chat-input-area {
      padding: 12px 16px;
      background-color: #ffffff;
      border-top: 1px solid #e5e5ea;
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #d1d1d6;
      border-radius: 20px;
      font-size: 15px;
      outline: none;
    }

    .chat-input-area input:focus {
      border-color: #007aff;
    }

    .chat-input-area button {
      padding: 12px 18px;
      background-color: #007aff;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .chat-input-area button:disabled {
      background-color: #b0b0b5;
      cursor: not-allowed;
    }
    /* 헤더 및 드롭다운 메뉴 스타일 */
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background-color: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    position: relative;
  }
  .menu-container {
    position: relative;
  }
  .menu-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .menu-btn:hover {
    background-color: #f3f4f6;
  }
  .dropdown-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 36px;
    background-color: #ffffff;
    border: 1px solid #e5e7eb;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    border-radius: 6px;
    width: 140px;
    z-index: 100;
  }
  .dropdown-menu.show {
    display: block;
  }
  .dropdown-item {
    display: block;
    width: 100%;
    padding: 10px 14px;
    text-align: left;
    background: none;
    border: none;
    font-size: 14px;
    color: #374151;
    cursor: pointer;
    text-decoration: none;
  }
  .dropdown-item:hover {
    background-color: #f3f4f6;
  }

  /* 모달 전체 배경 오버레이 */
    .modal-overlay {
      display: none; /* 평소엔 숨김 */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    /* 모달 창 본체 */
    .modal-content {
      background-color: #ffffff;
      padding: 24px;
      border-radius: 16px;
      width: 80%;
      max-width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .modal-content h3 {
      margin-bottom: 12px;
      font-size: 18px;
      color: #1c1c1e;
    }

    .modal-content p {
      font-size: 14px;
      color: #3a3a3c;
      line-height: 1.5;
      margin-bottom: 20px;
      text-align: left;
    }

    /* 확인 버튼 */
    .modal-close-btn {
      width: 100%;
      padding: 10px;
      background-color: #007aff;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .modal-close-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<div class="chat-container" style="max-width: 480px; margin: 20px auto; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: #fff;">
  
  <!-- 헤더 영역 -->
  <div class="chat-header" style="display: flex; justify-content: space-between; align-items: center; position: relative; padding: 16px; background-color: #f9fafb; border-bottom: 1px solid #e5e7eb;">
    <span><b>학교 AI 도우미</b></span>
    
    <div class="menu-container">
      <button class="menu-btn" id="menuToggle" onclick="toggleDropdown(event)" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 0 4px;">⋮</button>
      <div class="dropdown-menu" id="dropdownMenu" style="display: none; position: absolute; right: 0; top: 30px; background-color: #ffffff; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-radius: 6px; z-index: 100;">
        <button class="dropdown-item" onclick="openModal('terms')" style="display: block; width: 100%;; text-align: left; background: none; border: none; font-size: 13px; cursor: pointer;">이용약관</button>
        <button class="dropdown-item" onclick="openModal('credits')" style="display: block; width: 100%; text-align: left; background: none; border: none; font-size: 13px; cursor: pointer;">크레딧</button>
      </div>
    </div>
  </div>
    
  <!-- 메시지 영역 -->
  <div class="chat-messages" id="chatMessages" style="padding: 16px; height: 350px; overflow-y: auto;">
    <div class="message ai">안녕하세요! 우리 학교에 대해 궁금한 점을 물어보세요.</div>
  </div>

  <!-- 입력 영역 -->
  <div class="chat-input-area" style="display: flex; padding: 12px; border-top: 1px solid #e5e7eb; background: #fff;">
    <input type="text" id="userInput" placeholder="메시지를 입력하세요..." onkeypress="handleKeyPress(event)" style="flex: 1; border: 1px solid #d1d5db; border-radius: 20px; outline: none;">
    <button id="sendBtn" onclick="sendMessage()" style="margin-left: 8px; background: #007bff; color: white; border: none; border-radius: 20px; cursor: pointer;">전송</button>
  </div>

</div>
<!-- 이용약관 모달 오버레이 -->
<div class="modal-overlay" id="termsModal">
  <div class="modal-content">
    <h3>이용약관</h3>
    <p>
      본 서비스는 학교 Ai 도우미 앱으로 모두를 위한 교육용 서비스입니다.<br>
      이용 시 발생하는 모든 책임은 사용자에게 있으며, 부적절한 사용은 제한될 수 있습니다. <br>
      생성형 Ai를 이용한 서비스이며 Ai가 제공하는 정보는 부정확할 수 있습니다. <br> <br>
      2026.9.6 / ver.1.0.3
    </p>
    <button class="modal-close-btn" onclick="closeModal('terms')">확인</button>
  </div>
</div>
<div class="modal-overlay" id="creditsModal">
  <div class="modal-content">
    <h3>크레딧</h3>
    <p>
    아이디어와 채팅할 수 있는 Ai 모델을 제공한 DeepSeek에 감사 드림.<br>
    프로젝트를 검토하고 배포를 도와준 Google Gemini에 감사 드림.
    </p>
    <button class="modal-close-btn" onclick="closeModal('credits')">확인</button>
  </div>
</div>
<script>
  const chatMessages = document.getElementById('chatMessages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  // 기기 고유 ID 생성 및 불러오기 함수 (UUID)
  function getDeviceId() {
    let deviceId = localStorage.getItem('chat_device_id');
    if (!deviceId) {
      deviceId = 'device_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
      localStorage.setItem('chat_device_id', deviceId);
    }
    return deviceId;
  }

  function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function appendMessage(text, type) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', type);
    msgDiv.innerText = text;
    chatMessages.appendChild(msgDiv);
    scrollToBottom();
    return msgDiv;
  }

  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      sendMessage();
    }
  }

  async function sendMessage() {
    const message = userInput.value.trim();
    if (!message) return;

    userInput.value = '';
    userInput.disabled = true;
    sendBtn.disabled = true;

    appendMessage(message, 'user');
    const aiMsgDiv = appendMessage('답변을 생각 중입니다...', 'ai');
    const deviceId = getDeviceId();

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          message: message,
          device_id: deviceId
        })
      });

      if (!response.ok) {
        aiMsgDiv.className = 'message blocked';
        aiMsgDiv.innerText = '서버 응답 오류가 발생했습니다.';
        return;
      }

      // 💡 [핵심 수정] StreamingResponse를 읽어오기 위한 Stream Reader 처리
      aiMsgDiv.innerText = ""; // "답변을 생각 중입니다..." 초기화
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      
      let fullText = "";
// // 💡 [최종 수정된 스트림 수신부]
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        
        const chunk = decoder.decode(value, { stream: true });
        fullText += chunk;
        
        // 입력 또는 출력 검열에 걸린 경우
        if (fullText.includes("범위를 벗어난") || 
            fullText.includes("부적절한 내용") || 
            fullText.includes("일시 제한")) {
          
          aiMsgDiv.className = 'message blocked';
          
          // 💡 핵심: 앞서 출력되던 찌꺼기 텍스트를 무시하고, 오직 깔끔한 에러 메시지만 화면에 덮어씌움!
          if (fullText.includes("일시 제한")) {
            aiMsgDiv.innerText = "이용 약관 위반으로 인해 귀하의 계정은 일시 제한되었습니다. 나중에 다시 시도해주세요.";
            userInput.placeholder = "이용이 제한된 계정입니다.";
            userInput.disabled = true;
            sendBtn.disabled = true;
          } else if (fullText.includes("범위를 벗어난")) {
            aiMsgDiv.innerText = "죄송합니다. 현재 제 범위를 벗어난 질문입니다. 다른 이야기를 해볼까요?";
          } else {
            aiMsgDiv.innerText = "죄송합니다. 제 답변 중에 부적절한 내용이 포함되어 있었습니다. 다른 주제로 이야기 해볼까요?";
          }
          
          break; // 스트리밍 즉시 종료
        }
        
        // 정상적인 응답일 때만 텍스트를 누적해서 출력
        aiMsgDiv.innerText = fullText;
        scrollToBottom();
      }

    } catch (error) {
      aiMsgDiv.className = 'message blocked';
      aiMsgDiv.innerText = '서버에 연결할 수 없습니다.';
    } finally {
      if (userInput.placeholder !== "이용이 제한된 계정입니다.") {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }
  }
  async function getDeviceAndOSInfo() {
  let osVersion = "Unknown OS";
  let deviceModel = "Unknown Device";

  // 1. 최신 Client Hints API 지원 여부 확인 (Chrome, Edge 등)
  if (navigator.userAgentData) {
    try {
      const uaData = await navigator.userAgentData.getHighEntropyValues([
        "platform",
        "platformVersion",
        "model",
        "fullVersionList"
      ]);
      
      // OS 및 버전
      osVersion = `${uaData.platform} ${uaData.platformVersion}`;
      
      // 기기 모델 (모바일 기기 등에서 주로 제공)
      if (uaData.model) {
        deviceModel = uaData.model;
      }
    } catch (e) {
      console.log("Client Hints API failed, falling back to User-Agent");
    }
  }

  // 2. Client Hints로 모델을 못 가져왔거나 사파리 등 구형 방식이 필요한 경우
  const ua = navigator.userAgent;
  if (deviceModel === "Unknown Device") {
    if (/iPhone/.test(ua)) deviceModel = "iPhone";
    else if (/iPad/.test(ua)) deviceModel = "iPad";
    else if (/Android/.test(ua)) {
      // 안드로이드 기기명 추출 시도
      const match = ua.match(/\(([^)]+)\)/);
      if (match) {
        const parts = match[1].split(";");
        // 보통 안드로이드 UA 문자열의 중간 부근에 기기 모델명이 포함됨
        const potentialModel = parts.find(p => p.includes("Build") || p.includes("Mobile") || p.includes("SM-") || p.includes("Pixel"));
        deviceModel = potentialModel ? potentialModel.trim() : "Android Device";
      }
    } else {
      deviceModel = "PC / Desktop";
    }
  }

  // OS 버전이 여전히 미상이면 UA 문자열 기반으로 대략적인 파싱
  if (osVersion === "Unknown OS") {
    if (/Windows NT 10.0/.test(ua)) osVersion = "Windows 10/11";
    else if (/Mac OS X/.test(ua)) {
      const match = ua.match(/Mac OS X ([_,\d]+)/);
      osVersion = match ? `macOS ${match[1].replace(/_/g, '.')}` : "macOS";
    } else if (/like Mac OS X/.test(ua)) {
      const match = ua.match(/CPU OS ([_\d]+) like Mac OS X/);
      osVersion = match ? `iOS ${match[1].replace(/_/g, '.')}` : "iOS";
    } else if (/Android/.test(ua)) {
      const match = ua.match(/Android ([\d.]+)/);
      osVersion = match ? `Android ${match[1]}` : "Android";
    }
  }

  return { deviceModel, osVersion };
}

// 예시: 서버로 보낼 때 사용
async function sendDeviceInfoToServer() {
  const info = await getDeviceAndOSInfo();
  
  // FastAPI 서버의 기기 정보 저장 엔드포인트로 전송
  fetch('/api/device', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(info)
  });
}
  // 모달 열기
  function openModal(type) {
    if (type === 'terms') {
      document.getElementById('termsModal').style.display = 'flex';
    }
    if (type === 'credits') {
      document.getElementById('creditsModal').style.display = 'flex';
    }    
    // 드롭다운 메뉴가 열려있었다면 같이 닫아주기
    const menu = document.getElementById('dropdownMenu');
    if (menu) menu.classList.remove('show');
  }

  // 모달 닫기
  function closeModal(type) {
    if (type === 'terms') {
      document.getElementById('termsModal').style.display = 'none';
    }
   if (type === 'credits') {
      document.getElementById('creditsModal').style.display = 'none';
    }
  }

  // (선택) 모달 바깥 배경을 눌렀을 때도 닫히게 하려면
  window.addEventListener('click', function(event) {
    const termsModal = document.getElementById('termsModal');
    const creditsModal = document.getElementById('creditsModal');

    // 이용약관 배경을 눌렀을 때
    if (event.target === termsModal) {
      termsModal.style.display = 'none';
    }
    // 크레딧 배경을 눌렀을 때
    if (event.target === creditsModal) {
      creditsModal.style.display = 'none';
    }
  });
// 드롭다운 열고 닫기
  function toggleDropdown(event) {
    event.stopPropagation();
    const menu = document.getElementById('dropdownMenu');
    // 현재 상태에 따라 보이기/숨기기 토글
    if (menu.style.display === 'block') {
      menu.style.display = 'none';
    } else {
      menu.style.display = 'block';
    }
  }

  // 화면 다른 곳을 누르면 드롭다운 닫기
  window.addEventListener('click', function() {
    const menu = document.getElementById('dropdownMenu');
    if (menu && menu.style.display === 'block') {
      menu.style.display = 'none';
    }
  });


</script>
</body>
</html>
